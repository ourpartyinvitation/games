<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Zone</title>
    
    <!-- Mengambil Font Lucu dari Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Menghubungkan CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="hero-section">
        <div class="hero-content">
            <h1>🎮 Zona Game! 🚀</h1>
            <p>Pilih game favoritmu, kumpulkan skor, dan jadilah juara!</p>
        </div>
    </header>

    <main>
        <!-- Container Grid 3x3 tempat kartu game akan muncul -->
        <div id="game-grid" class="game-grid">
            <!-- Kartu game akan di-inject oleh JavaScript di sini -->
        </div>
    </main>

    <!-- Menghubungkan JavaScript -->
    <script src="script.js"></script>
</body>
</html>
